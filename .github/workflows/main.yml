name: main

"on":
  workflow_dispatch:
  push: { branches: [main] }
  # Pull requests run the exact same lint/build/test jobs as main, against the
  # PR merged into main, so a green PR means a green main after merge.
  pull_request: { branches: [main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # https://github.com/rust-lang/rust-analyzer/blob/935883fd826c46e7e7e6de19cf24377c21f1b2ba/.github/workflows/ci.yaml#L63-L67
      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add --toolchain stable rustfmt clippy
          rustup show

      - name: Cache Build
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"

      - name: Install npm dependencies
        run: npm ci

      - name: Check Node version consistency
        run: npm run check:node

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup show

      - name: Cache Build
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run e2e tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # The dev container is not part of the deployment, but it silently rotted
  # because nothing ever built it. Build it on every PR so feature/image bumps
  # are verified before they land.
  devcontainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build dev container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -o errexit
            cargo --version
            node --version
            npx playwright --version
            caddy version
            aws --version

  # Compiles exactly what the deploy job compiles, so a release-only build
  # failure is caught on the PR instead of after merging to main.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          rustup show

      - name: Cache Build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

  deploy:
    needs: [lint, test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://georgewitteman.com
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # https://github.com/georgewitteman/terraform/blob/main/aws_iam.tf
          role-to-assume: arn:aws:iam::866631827662:role/GitHubActionsOIDC
          aws-region: us-west-2
          mask-aws-account-id: false

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          rustup show

      - name: Cache Build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Deploy
        run: ./scripts/build-and-deploy.sh
