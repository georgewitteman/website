[package]
name = "website"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
askama = "0.16.0"
serde = { version = "1.0", features = ["derive"] }
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = { version = "0.8.9", features = ["macros", "http2"] }
csv = "1.4.0"
ipnet = "2.12.1"
multimap = "0.10.1"
reqwest = "0.13.4"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header", "trace"] }
http-body-util = "0.1.4"
uuid = { version = "1.24.0", features = ["v4"] }
woothee = "0.13.0"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
